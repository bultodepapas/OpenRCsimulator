name: Graphics audit integration qualification

on:
  push:
    branches: [graphics-audit-main-integration-2026-11-22]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            app
            tools
            assets/aircraft
            docs/research/ai-companions/AFC-02-R5/source-requalification-2026-11-08/tapes
            docs/research/ai-companions/AFC-02/rebinds
      - name: Fetch the accepted solver baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json; print(json.load(open("tools/companions/qualification.json"))["accepted"]["rev"])')"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 --filter=blob:none origin "$baseline"
          git ls-tree -r "$baseline" -- app/sim app/physics app/failures | awk '{print $3}' | sort -u > "$RUNNER_TEMP/baseline-blobs"
          git fetch --quiet --no-tags --stdin origin < "$RUNNER_TEMP/baseline-blobs"
      - name: Check the merged performance analyzer
        run: python3 -m unittest discover -s tools/godtest -p 'test_*.py'
      - name: Import with the pinned engine
        shell: bash
        run: |
          set -euo pipefail
          godot="$(app/get-godot.sh)"
          "$godot" --version
          python3 tools/godot/run_checked.py --timeout 1800 --out-dir tmp/integration-checks --label import -- "$godot" --headless --path app --audio-driver Dummy --import
          python3 - "$godot" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          p = pathlib.Path(sys.argv[1])
          identity = {"version": subprocess.check_output([str(p), "--version"], text=True).strip(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
          assert identity["version"] == "4.8.beta2.official.cafc17a19", identity
          assert identity["sha256"] == "34d0599a1f17acc76583610969878065d1b1701615af77271e32201351b9c564", identity
          pathlib.Path("tmp/integration-engine.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY
      - name: Reconcile the declared behavior sources
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          def normalized(path):
              text = path.read_bytes().decode("utf-8", errors="strict").replace("\r\n", "\n")
              assert "\r" not in text, path
              return text.encode("utf-8")
          manifest_path = pathlib.Path("app/data/ai/companions/behavior-manifest.json")
          profile_path = pathlib.Path("app/data/ai/companions/aircraft/jensen-das-ugly-stik-60.json")
          manifest = json.loads(manifest_path.read_bytes())
          assert manifest["normalization"] == "utf8-lf" and len(manifest["sources"]) == 16
          before = dict(manifest["sources"])
          for source in manifest["sources"]:
              assert source.startswith("res://")
              manifest["sources"][source] = hashlib.sha256(normalized(pathlib.Path("app") / source[6:])).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          profile = json.loads(profile_path.read_bytes())
          profile["behavior_manifest"]["sha256"] = hashlib.sha256(normalized(manifest_path)).hexdigest()
          profile_path.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("tmp/integration-behavior.json").write_text(json.dumps({"before":before,"after":manifest["sources"],"manifest_sha256":profile["behavior_manifest"]["sha256"]}, indent=2) + "\n")
          PY
      - name: Compare all nine retained tapes before renewing the solver pin
        run: python3 tools/companions/rebind.py --godot "$(app/get-godot.sh)" --jobs 2 --workspace-root "$RUNNER_TEMP" --accept
      - name: Check strict admission and affected consumers
        shell: bash
        run: |
          set -euo pipefail
          godot="$(app/get-godot.sh)"
          python3 - "$godot" <<'PY'
          import subprocess, sys
          markers = {
              "companions_behavior_manifest": ["companion behavior manifest:", "0 failed"],
              "companions_profiles": ["AFC-02 companion profile validation:", "0 failed"],
              "companions_draft_refresh": ["companions draft refresh:", "0 failed"],
              "companions_airspace": ["AFC-02 static airspace validation:", "0 failed"],
              "companions_manager": ["companions manager:", "0 failed"],
              "scenery_destruction": ["scenery destruction:", "0 failures"],
              "camera_collision": ["camera collision checks passed"],
              "settings_ui": ["all Settings checks passed"],
              "advanced_graphics_settings": ["advanced graphics:", "0 failed"],
              "ui_settings_integration": ["all Settings integration checks passed"],
              "metalfx_policy": ["metalfx policy:", "0 failed"],
              "flight_resolution_policy": ["Flight resolution policy: 0 failed"],
              "rcv_session": ["RCV session:", "0 failed"],
              "rcv_nitro_service": ["RCV Nitro service:", "0 failed"],
              "lighting_vfx_lod": ["lighting VFX LOD checks=", "failures=0"],
              "flaps_ui": ["flaps UI:", "0 failures"],
          }
          for test, required in markers.items():
              command = [sys.executable, "tools/godot/run_checked.py", "--timeout", "240", "--out-dir", "tmp/integration-checks", "--label", test]
              for marker in required:
                  command += ["--require-text", marker]
              subprocess.run(command + ["--", sys.argv[1], "--headless", "--path", "app", "--audio-driver", "Dummy", "--script", "res://tests/test_" + test + ".gd"], check=True)
          PY
      - name: Retain only source-bound qualified records
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path(".")
          q = pathlib.Path("tools/companions/qualification.json")
          contract = json.loads(q.read_bytes())
          assert contract["accepted"]["rev"] == os.environ["GITHUB_SHA"]
          new_receipts = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "--", contract["receipts"]], text=True).splitlines()
          assert len(new_receipts) == 1, new_receipts
          receipt = pathlib.Path(new_receipts[0])
          report = json.loads(receipt.read_bytes())
          assert report["head"] == os.environ["GITHUB_SHA"] and report["identical"] and report["solver_tree_committed"]
          assert len(report["tapes"]) == 9 and all(t["identical"] and t["rows"] == 2881 for t in report["tapes"])
          uid_sources = ["render/flight_dynamic_resolution.gd", "render/flight_resolution_policy.gd", "tests/probe_completed_gpu_frame.gd", "tests/probe_flight_resolution_stress.gd", "tests/test_flight_resolution_policy.gd"]
          uids = [pathlib.Path("app") / (name + ".uid") for name in uid_sources]
          assert all(p.read_text().strip().startswith("uid://") for p in uids)
          checks = list(pathlib.Path("tmp/integration-checks").glob("*/report.json"))
          assert len(checks) == 17 and all(json.loads(p.read_bytes())["ok"] is True for p in checks), checks
          files = [q, pathlib.Path(contract["profile"]), receipt, pathlib.Path("app/data/ai/companions/behavior-manifest.json"), *uids]
          allowed = {str(p) for p in files}
          changed = subprocess.check_output(["git", "diff", "HEAD", "--name-only"], text=True).splitlines()
          added = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          assert set(changed + added) <= allowed, {"unexpected": sorted(set(changed + added) - allowed)}
          for check in checks:
              log = (check.parent / "engine.log").read_text()
              if json.loads(check.read_bytes())["label"] == "import":
                  continue
              counts = [int(n) for match in re.findall(r"(?:^|\s)(\d+) checks|checks=(\d+)", log) for n in match if n]
              if counts:
                  assert all(n > 0 for n in counts), check
          for p in files:
              target = pathlib.Path("qualified") / p
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(p, target)
          summary = {"source":os.environ["GITHUB_SHA"], "source_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(), "generated_source_changes": {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, "unexpected_tracked_or_untracked_inputs":[], "run_id":os.environ["GITHUB_RUN_ID"], "engine":json.loads(pathlib.Path("tmp/integration-engine.json").read_bytes()), "behavior":json.loads(pathlib.Path("tmp/integration-behavior.json").read_bytes()), "checks":[json.loads(p.read_bytes()) for p in checks], "qualified_files":[str(p) for p in files]}
          pathlib.Path("qualified/integration-evidence.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graphics-audit-integration-${{ github.sha }}
          path: |
            qualified/
            tmp/integration-checks/
            tmp/integration-engine.json
            tmp/integration-behavior.json
          if-no-files-found: error
          retention-days: 7
