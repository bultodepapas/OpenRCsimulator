name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  three:
    name: three.js prototype (archived bake-off build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prototypes/stage0/three
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototypes/stage0/three/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-three
          path: prototypes/stage0/capture-three*.png

  app:
    name: Godot app (${{ matrix.part }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: integration, shard: 0, shards: 1}
          - {part: units, shard: 0, shards: 8}
          - {part: units, shard: 1, shards: 8}
          - {part: units, shard: 2, shards: 8}
          - {part: units, shard: 3, shards: 8}
          - {part: units, shard: 4, shards: 8}
          - {part: units, shard: 5, shards: 8}
          - {part: units, shard: 6, shards: 8}
          - {part: units, shard: 7, shards: 8}
    env:
      OPENRC_TEST_PART: ${{ matrix.part }}
      OPENRC_UNIT_SHARD: ${{ matrix.shard }}
      OPENRC_UNIT_SHARDS: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tagged releases require their own notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "docs/releases/$RELEASE_TAG.md"
          # Stable software may include explicitly documented experimental aircraft/features.
          # app/test.sh keeps the named physical pending checks separate; software failures remain fatal.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: godot-${{ hashFiles('app/get-godot.sh') }}
      - name: Import resources before schema probes
        id: resource_import
        if: matrix.part == 'integration'
        run: |
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/godot-checks --label ci-resource-import -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy --import
      - name: Aircraft v2 contract and explicit v1 loader compatibility (AS-01, DATA-4a)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv "$RUNNER_TEMP/aircraft-schema-venv"
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" -m pip install -r research/aircraft-data/schema/requirements.txt
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-data/schema/check.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-data/schema/test_contract.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/helicopter/hx700/test_schema.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-standardization/test_schema_v2.py --godot "$(app/get-godot.sh)"
      - name: Generator Python dependencies (X8-06 derive_physics.py needs numpy)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/generator-venv"
          "$RUNNER_TEMP/generator-venv/bin/python" -m pip install -r research/skywalker-x8/X8-06/requirements.txt
          echo "$RUNNER_TEMP/generator-venv/bin" >> "$GITHUB_PATH"
      - name: Generated geometry and physics data match their sources
        if: matrix.part == 'integration'
        run: |
          python3 assets/aircraft/ugly-stik-60/compile_geometry.py --check
          python3 assets/aircraft/extra-300s-60/compile_geometry.py --check
          python3 assets/aircraft/extra-300s-60/compile_appearance.py --check
          python3 assets/aircraft/avanti-s-a200/compile_geometry.py --check
          python3 assets/aircraft/p51d-mustang-120/build_geometry.py --check
          python3 assets/aircraft/p51d-mustang-120/compile_geometry.py --check
          python3 research/extra-300/ex14/ground_effect_vlm.py --check
          python3 research/extra-300/ex05/derive_physics.py --check
          python3 research/p51/p51-05/derive_physics.py --check
          python3 research/timber/tt01/manifest.py --check
          python3 assets/aircraft/turbo-lumber-evolution/build_geometry.py --check
          python3 assets/aircraft/turbo-lumber-evolution/compile_geometry.py --check
          python3 research/timber/tt07/derive_physics.py --check
          python3 research/skywalker-x8/X8-00/manifest.py --check
          python3 research/skywalker-x8/X8-02/install_assets.py --check
          python3 research/skywalker-x8/X8-02/compile_model.py --check
          python3 research/skywalker-x8/X8-06/derive_physics.py --check
      - name: Offline measurement and validation tool regressions
        if: matrix.part == 'integration'
        run: |
          python3 app/tests/test_ci_partitions.py
          python3 app/tests/test_export_identity.py
          python3 research/rc-monster-truck/native/test_install_only.py
          python3 research/f4u-corsair/F4U-07/test_generated_identity.py
          research/test-tools.sh
      - name: NK-3 trajectory evidence policy (no native library required)
        if: matrix.part == 'integration'
        run: |
          python3 tools/godot/run_checked.py --timeout 90 --out-dir tmp/godot-checks --label nk3-trajectory-policy \
            --require-text 'NK3_TRAJECTORY_POLICY verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_trajectory.gd"
      - name: Optional process RAM and I/O backend regressions (PT1h-R4)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv "$RUNNER_TEMP/godot-resources-venv"
          "$RUNNER_TEMP/godot-resources-venv/bin/python" -m pip install -r tools/godot/requirements-resources.txt
          "$RUNNER_TEMP/godot-resources-venv/bin/python" -m unittest discover -s tools/godot -p 'test_resource*.py'
      - run: app/test.sh
        id: app_check
      - name: Validate diagnostic evidence and export JUnit
        if: always() && (steps.resource_import.outcome != 'skipped' || steps.app_check.outcome != 'skipped')
        run: python3 tools/godot/summarize.py tmp/godot-checks --junit tmp/godot-checks/results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (steps.resource_import.outcome != 'skipped' || steps.app_check.outcome != 'skipped')
        with:
          name: godot-diagnostics-${{ matrix.part }}-${{ matrix.shard }}
          path: tmp/godot-checks/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.app_check.outcome != 'skipped' && matrix.part == 'integration'
        with:
          name: godot-expected-diagnostics-${{ matrix.part }}-${{ matrix.shard }}
          path: tmp/godot-checks-expected/
          if-no-files-found: ignore
          retention-days: 7

  native-linux:
    name: RC native Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: godot-${{ hashFiles('app/get-godot.sh') }}
      - name: RC native Linux build, float64 loading and reference parity
        # This verifies the Linux host artifact. App installation requires the
        # separately qualified Windows artifact as well; macOS uses GDScript.
        run: python3 research/rc-monster-truck/native/build.py --jobs 2 --godot "$(app/get-godot.sh)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc-native-linux
          include-hidden-files: true # Explicit generated files inside .tools only.
          path: |
            .tools/native-ground-vehicle/libopenrc_ground_vehicle.so
            .tools/native-ground-vehicle/build-receipt.linux.json
            .tools/native-ground-vehicle/parity-linux-latest.log
            .tools/native-ground-vehicle/godot-cpp/LICENSE.md

  native-kernel-linux:
    name: NK-3 native kernel qualification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install native build and Godot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 binutils python3-venv libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
          mkdir -p "$RUNNER_TEMP/nk3-toolchain" tmp/nk3-ci
          ln -s "$(command -v gcc-13)" "$RUNNER_TEMP/nk3-toolchain/gcc"
          ln -s "$(command -v g++-13)" "$RUNNER_TEMP/nk3-toolchain/g++"
          echo "$RUNNER_TEMP/nk3-toolchain" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: godot-${{ hashFiles('app/get-godot.sh') }}
      - name: Import project resources with checked diagnostics
        run: |
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/nk3-ci/checks --label nk3-import -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy --import
      - name: Build the locked native stage
        run: python3 research/native-kernel/build.py --jobs 2 2>&1 | tee tmp/nk3-ci/build-output.log
      - name: Test guarded library loading in disposable projects
        run: |
          python3 research/native-kernel/test_installation.py --godot "$(app/get-godot.sh)" \
            --library "$PWD/tmp/native-kernel/lib/libopenrc_native_kernel.so" \
            --stage "$PWD/app/sim/native_stage.gd" 2>&1 | tee tmp/nk3-ci/installation-tests.log
      - name: Compare native stage and reference on 12,000 states
        run: |
          python3 research/native-kernel/run.py --godot "$(app/get-godot.sh)" --script stage_oracle.gd \
            --states 12000 --timeout 1800 2>&1 | tee tmp/nk3-ci/stage-oracle.log
      - name: Compare full trajectories without timing
        run: |
          python3 research/native-kernel/run.py --godot "$(app/get-godot.sh)" --script trajectory.gd \
            --option ticks=14400 --option skip-timing=true --timeout 2400 2>&1 | tee tmp/nk3-ci/trajectory.log
      - name: Install the verified library for production-path tests
        run: python3 research/native-kernel/build.py --install-app 2>&1 | tee tmp/nk3-ci/install-output.log
      - name: Require native stage, session and replay test branches
        run: |
          godot="$(app/get-godot.sh)"
          python3 tools/godot/run_checked.py --timeout 180 --out-dir tmp/nk3-ci/checks --label nk3-native-stage \
            --require-text 'NK3_NATIVE_STAGE_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_stage.gd
          python3 tools/godot/run_checked.py --timeout 240 --out-dir tmp/nk3-ci/checks --label nk3-native-session \
            --require-text 'NK3_NATIVE_SESSION_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_session.gd
          python3 tools/godot/run_checked.py --timeout 180 --out-dir tmp/nk3-ci/checks --label nk3-native-replay \
            --require-text 'NK3_NATIVE_REPLAY_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_replay.gd
      - name: Check production reference/native parity (smoke only)
        run: |
          python3 research/performance/session_baseline.py --godot "$(app/get-godot.sh)" \
            --out tmp/nk3-ci/production-probe --aircraft jensen-das-ugly-stik-60 --case trim,runway \
            --warmup-ticks 24 --sample-ticks 240 --repeats 1 --compare-backends --timeout 300 \
            2>&1 | tee tmp/nk3-ci/production-probe.log
      - name: Publish verified NK-3 build inputs for export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nk3-native-linux-build
          path: |
            tmp/native-kernel/lib/libopenrc_native_kernel.so
            tmp/native-kernel/build-receipt.json
            tmp/native-kernel/stage-*.json
            tmp/native-kernel/trajectory-*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nk3-native-linux-diagnostics
          path: |
            tmp/nk3-ci/
            tmp/native-kernel/build.log
            tmp/native-kernel/build-receipt.json
            tmp/native-kernel/stage-*.json
            tmp/native-kernel/trajectory-*.json
            tmp/native-kernel/checks/
            app/native/kernel/build-receipt.json
          if-no-files-found: ignore
          retention-days: 7

  visuals:
    name: Godot visual captures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: godot-${{ hashFiles('app/get-godot.sh') }}
      - run: app/capture.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() # Preserve diagnostics when a capture gate fails.
        with:
          name: captures-app
          path: app/captures/*

  native-windows:
    name: RC native Windows build
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download pinned Godot Windows console editor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Godot_v4.8-beta1_win64.exe.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.8-beta1'
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.8-beta1/Godot_v4.8-beta1_win64.exe.zip' `
            -OutFile $archive
          $expected = 'bdc79f8ef47c3794c6984751bbac2c1934cf1c7c9ceebc2d0e87db0846766411b7bbbb6fecf90f3485f951a1289c3171b1c7bebca18dcdd8e08bd81de95b6cc0'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Godot Windows archive SHA-512 mismatch: expected $expected, got $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Filter 'Godot_v4.8-beta1_win64_console.exe' -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) {
            throw 'Pinned Godot Windows console executable was not present in the verified archive.'
          }
          $version = (& $godot --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '4.8.beta1.official.4d10419ca') {
            throw "Unexpected Godot Windows version: $version"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GODOT_WINDOWS_EXE=$godot"
      - name: Build, load, float64-check and compare the native Windows evaluator
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'The pinned MSVC C++ toolchain is not installed on this runner.'
          }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devcmd -PathType Leaf)) {
            throw "Visual Studio developer command file was not found: $devcmd"
          }
          $command = "call `"$devcmd`" -no_logo -arch=amd64 -host_arch=amd64 >nul && set"
          $developerEnvironment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not initialize the x64 Visual Studio developer environment.'
          }
          foreach ($entry in $developerEnvironment) {
            $separator = $entry.IndexOf('=')
            if ($separator -gt 0) {
              $name = $entry.Substring(0, $separator)
              $value = $entry.Substring($separator + 1)
              Set-Item -Path "Env:$name" -Value $value
            }
          }
          where.exe cl.exe
          if ($LASTEXITCODE -ne 0) {
            throw 'MSVC cl.exe was not available after initializing the developer environment.'
          }
          python research/rc-monster-truck/native/build.py --jobs 2 --godot "$env:GODOT_WINDOWS_EXE"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc-native-windows
          include-hidden-files: true # Explicit generated files inside .tools only.
          path: |
            .tools/native-ground-vehicle/openrc_ground_vehicle.dll
            .tools/native-ground-vehicle/build-receipt.windows.json
            .tools/native-ground-vehicle/parity-windows-latest.log

  # PT1: release builds. On main (which also warms the template cache: tag runs can only restore caches made on the
  # default branch), on v* tags, and by hand. Fails if an export errors, the exported Linux binary does not fly the
  # trimmed-flight check, or the macOS bundle is not universal and ad-hoc signed (app/export.sh).
  export:
    name: Release builds (Windows, Linux, macOS)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Package in parallel with app/visual checks; publication below still requires every check.
    needs: [native-linux, native-windows, native-kernel-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history and tags: git describe names the packages and the build (UI-04a)
      - run: sudo apt-get update && sudo apt-get install -y zip libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: godot-${{ hashFiles('app/get-godot.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('app/get-templates.sh') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-native-linux
          path: ${{ runner.temp }}/rc-native-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-native-windows
          path: ${{ runner.temp }}/rc-native-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nk3-native-linux-build
          path: tmp/native-kernel
      - name: Install matching Windows and Linux native artifacts before export
        run: |
          native_tool_root=".tools/native-ground-vehicle"
          mkdir -p "$native_tool_root"
          cp "$RUNNER_TEMP/rc-native-linux/libopenrc_ground_vehicle.so" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-linux/build-receipt.linux.json" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-windows/openrc_ground_vehicle.dll" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-windows/build-receipt.windows.json" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-linux/godot-cpp/LICENSE.md" "$native_tool_root/LICENSE.godot-cpp.md"
          python3 research/rc-monster-truck/native/build.py --install-only
      - name: Install oracle-qualified NK-3 Linux artifact before export
        run: |
          godot="$(app/get-godot.sh)"
          "$godot" --version
          python3 research/native-kernel/build.py --install-app
      - run: app/export.sh # names the packages with git describe, the same identity the app shows (UI-04a)
      - name: Preserve NK-3 package qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nk3-package-diagnostics
          path: |
            tmp/nk3-export-*/checks/
            tmp/nk3-export-*/user-data/
            tmp/nk3-export-*/player-replay/
            tmp/nk3-export-*/production-pair/
            tmp/nk3-export-*/default-route/checks/
            tmp/nk3-export-*/default-route/*.csv
            tmp/nk3-export-*/default-route/*.json
            tmp/nk3-export-*/trimmed.csv
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-builds
          path: |
            dist/openrc-simulator-*.zip
            dist/SHA256SUMS

  release:
    name: GitHub release (v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [three, app, visuals, native-linux, native-windows, native-kernel-linux, export]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-builds
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PT1h: every tag has reviewed notes; never publish a stale first-launch guide as release history.
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$NOTES"
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            RELEASE_FLAGS+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/openrc-simulator-*.zip dist/SHA256SUMS \
            --title "OpenRC Simulator $GITHUB_REF_NAME" --notes-file "$NOTES" "${RELEASE_FLAGS[@]}"
