name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One developer can push directly to main. Only superseded PR runs are cancelled;
# main/tag/manual runs never cancel each other or lose pending verification.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI selection and release preflight
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.select.outputs.app }}
      three: ${{ steps.select.outputs.three }}
      site: ${{ steps.select.outputs.site }}
      export: ${{ steps.select.outputs.export }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Tag/version preflight and multi-commit push comparison.
      - name: CI orchestration regressions
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Check release source, version and notes before expensive jobs
        run: python3 tools/ci/release_preflight.py --root . --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - name: Record conservative selection (shadow mode keeps full production)
        id: select
        run: python3 tools/ci/policy.py scope --receipt tmp/ci-selection.json
      - name: Check changed documentation links against the selected source
        run: python3 tools/ci/check_docs.py --root . --receipt tmp/ci-selection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-selection
          path: tmp/ci-selection.json
          if-no-files-found: error
          retention-days: 7

  site:
    name: Website source and download checks
    needs: scope
    if: needs.scope.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Isolated website checker dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/python" -m pip install -r site/requirements-seo.txt
      - run: '"$RUNNER_TEMP/site-venv/bin/python" site/build_locales.py --check'
      - run: '"$RUNNER_TEMP/site-venv/bin/python" site/test_locales.py'
      - run: node --test site/test_downloads.cjs
      - run: python3 tools/analytics/test_github_history.py
  three:
    needs: scope
    if: needs.scope.outputs.three == 'true'
    name: three.js prototype (archived bake-off build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prototypes/stage0/three
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototypes/stage0/three/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-three
          path: prototypes/stage0/capture-three*.png

  app:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    name: Godot app (${{ matrix.part }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: integration, shard: 0, shards: 1}
          - {part: units, shard: 0, shards: 8}
          - {part: units, shard: 1, shards: 8}
          - {part: units, shard: 2, shards: 8}
          - {part: units, shard: 3, shards: 8}
          - {part: units, shard: 4, shards: 8}
          - {part: units, shard: 5, shards: 8}
          - {part: units, shard: 6, shards: 8}
          - {part: units, shard: 7, shards: 8}
    env:
      OPENRC_TEST_PART: ${{ matrix.part }}
      OPENRC_UNIT_SHARD: ${{ matrix.shard }}
      OPENRC_UNIT_SHARDS: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch fixed-brake historical source commits
        if: matrix.part == 'units'
        run: |
          set -euo pipefail
          index=0
          found=false
          for test in app/tests/test_*.gd; do
            if [[ "${test##*/}" == test_fixed_gear_brake_input.gd ]]; then
              found=true
              if (( index % OPENRC_UNIT_SHARDS == OPENRC_UNIT_SHARD )); then
                base=fa9f387f68f753d988456764f5723932eae64cea
                r3=20662f264acaed343b210d048f4ee7628ea5ee70
                timeout 900 git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$base" "$r3"
                tree=$(mktemp)
                wants=$(mktemp)
                trap 'rm -f "$tree" "$wants"' EXIT
                git ls-tree -r "$base" -- app > "$tree"
                [[ $(wc -l < "$tree") -eq 4291 ]] || { echo 'historical app tree differs' >&2; exit 1; }
                awk '{print $3}' "$tree" > "$wants"
                attributes=$(git ls-tree "$base" -- .gitattributes | awk '{print $3}')
                carburetor=$(git ls-tree "$r3" -- app/physics/glow/carburetor.gd | awk '{print $3}')
                [[ "$attributes" == 2bbe56293730deef6e66a0a3d26c438d2c308db5 ]] || exit 1
                [[ "$carburetor" == bb06578fabf39c78f04ea91f2b1b4af5408961b4 ]] || exit 1
                printf '%s\n' "$attributes" "$carburetor" >> "$wants"
                sort -u "$wants" -o "$wants"
                timeout 900 git fetch --quiet --no-tags --stdin origin < "$wants"
              fi
              break
            fi
            index=$((index + 1))
          done
          "$found" || { echo 'fixed-brake test missing' >&2; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools/Godot_v*_linux.x86_64
            .tools/Godot_v*_linux.x86_64.sha512
            .tools/Godot_v*_linux.x86_64.zip
          key: godot-editor-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-godot.sh') }}
      - name: Import resources before schema probes
        id: resource_import
        if: matrix.part == 'integration'
        run: |
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/godot-checks --label ci-resource-import -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy --import
      - name: Aircraft v2 contract and explicit v1 loader compatibility (AS-01, DATA-4a)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv "$RUNNER_TEMP/aircraft-schema-venv"
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" -m pip install -r research/aircraft-data/schema/requirements.txt
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-data/schema/check.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-data/schema/test_contract.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/helicopter/hx700/test_schema.py
          "$RUNNER_TEMP/aircraft-schema-venv/bin/python" research/aircraft-standardization/test_schema_v2.py --godot "$(app/get-godot.sh)"
      - name: Generator Python dependencies (X8-06 derive_physics.py needs numpy)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/generator-venv"
          "$RUNNER_TEMP/generator-venv/bin/python" -m pip install -r research/skywalker-x8/X8-06/requirements.txt
          echo "$RUNNER_TEMP/generator-venv/bin" >> "$GITHUB_PATH"
      - name: Release fixture inspection tools
        if: matrix.part == 'integration'
        run: sudo apt-get install -y binutils zip g++
      - name: Offline measurement and validation tool regressions
        if: matrix.part == 'integration'
        run: |
          python3 app/tests/test_ci_partitions.py
          python3 app/tests/test_export_identity.py
          python3 research/rc-monster-truck/native/test_install_only.py
          python3 research/f4u-corsair/F4U-07/test_generated_identity.py
          research/test-tools.sh
      - name: NK-3 trajectory evidence policy (no native library required)
        if: matrix.part == 'integration'
        run: |
          python3 tools/godot/run_checked.py --timeout 90 --out-dir tmp/godot-checks --label nk3-trajectory-policy \
            --require-text 'NK3_TRAJECTORY_POLICY verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_trajectory.gd"
          python3 tools/godot/run_checked.py --timeout 90 --out-dir tmp/godot-checks --label nk3-fleet-policy \
            --require-text 'NK3 fleet policy:' --require-text 'checks, 0 failed' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_fleet.gd"
      - name: Optional process RAM and I/O backend regressions (PT1h-R4)
        if: matrix.part == 'integration'
        run: |
          python3 -m venv "$RUNNER_TEMP/godot-resources-venv"
          "$RUNNER_TEMP/godot-resources-venv/bin/python" -m pip install -r tools/godot/requirements-resources.txt
          "$RUNNER_TEMP/godot-resources-venv/bin/python" -m unittest discover -s tools/godot -p 'test_resource*.py'
      - run: app/test.sh
        id: app_check
      - name: Upload discovered-script coverage receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-rosters-${{ matrix.part }}-${{ matrix.shard }}
          path: tmp/godot-checks/roster-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate diagnostic evidence and export JUnit
        if: always() && (steps.resource_import.outcome != 'skipped' || steps.app_check.outcome != 'skipped')
        run: python3 tools/godot/summarize.py tmp/godot-checks --junit tmp/godot-checks/results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (steps.resource_import.outcome != 'skipped' || steps.app_check.outcome != 'skipped')
        with:
          name: godot-diagnostics-${{ matrix.part }}-${{ matrix.shard }}
          path: tmp/godot-checks/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.app_check.outcome != 'skipped' && matrix.part == 'integration'
        with:
          name: godot-expected-diagnostics-${{ matrix.part }}-${{ matrix.shard }}
          path: tmp/godot-checks-expected/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.app_check.outcome != 'skipped' && matrix.part == 'units'
        with:
          name: fixed-brake-captures-${{ matrix.shard }}
          path: tmp/fixed-brake-evidence/*/*.json
          if-no-files-found: ignore
          retention-days: 7

  native-linux:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    name: RC native Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools/Godot_v*_linux.x86_64
            .tools/Godot_v*_linux.x86_64.sha512
            .tools/Godot_v*_linux.x86_64.zip
          key: godot-editor-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-godot.sh') }}
      - name: RC native Linux build, float64 loading and reference parity
        # This verifies the Linux host artifact. App installation requires the
        # separately qualified Windows artifact as well; macOS uses GDScript.
        run: python3 research/rc-monster-truck/native/build.py --jobs 2 --godot "$(app/get-godot.sh)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc-native-linux
          include-hidden-files: true # Explicit generated files inside .tools only.
          path: |
            .tools/native-ground-vehicle/libopenrc_ground_vehicle.so
            .tools/native-ground-vehicle/build-receipt.linux.json
            .tools/native-ground-vehicle/parity-linux-latest.log
            .tools/native-ground-vehicle/godot-cpp/LICENSE.md

  native-kernel-linux:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    name: NK-3 native kernel qualification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install native build and Godot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 binutils python3-venv libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
          mkdir -p "$RUNNER_TEMP/nk3-toolchain" tmp/nk3-ci
          ln -s "$(command -v gcc-13)" "$RUNNER_TEMP/nk3-toolchain/gcc"
          ln -s "$(command -v g++-13)" "$RUNNER_TEMP/nk3-toolchain/g++"
          echo "$RUNNER_TEMP/nk3-toolchain" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools/Godot_v*_linux.x86_64
            .tools/Godot_v*_linux.x86_64.sha512
            .tools/Godot_v*_linux.x86_64.zip
          key: godot-editor-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-godot.sh') }}
      - name: Import project resources with checked diagnostics
        run: |
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/nk3-ci/checks --label nk3-import -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy --import
      - name: Build the locked native stage
        run: python3 research/native-kernel/build.py --jobs 2 2>&1 | tee tmp/nk3-ci/build-output.log
      - name: Build the separate mutation control
        run: python3 research/native-kernel/build.py --mutant --jobs 2 2>&1 | tee tmp/nk3-ci/build-mutant-output.log
      - name: Test guarded library loading in disposable projects
        run: |
          python3 research/native-kernel/test_installation.py --godot "$(app/get-godot.sh)" \
            --library "$PWD/tmp/native-kernel/lib/libopenrc_native_kernel.so" \
            --stage "$PWD/app/sim/native_stage.gd" 2>&1 | tee tmp/nk3-ci/installation-tests.log
      - name: Run every required native evidence gate
        run: |
          python3 - "$(app/get-godot.sh)" <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import shlex
          import subprocess
          import sys

          root = Path.cwd()
          script = root / "research/native-kernel/build.py"
          spec = importlib.util.spec_from_file_location("nk3_ci_builder", script)
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          if set(builder.VERIFICATIONS) != set(builder.ORACLE_SCRIPTS) or set(builder.VERIFICATIONS) != set(builder.ORACLE_ARGUMENTS):
              raise SystemExit("The required evidence roster and oracle commands differ")
          logs = root / "tmp/nk3-ci/oracles"
          logs.mkdir(parents=True, exist_ok=True)
          for key in builder.VERIFICATIONS:
              options = shlex.split(builder.ORACLE_ARGUMENTS[key])
              if key == "trajectory":
                  if options.count("ticks=960") != 1:
                      raise SystemExit("The required trajectory arguments changed; review the longer CI run")
                  options[options.index("ticks=960")] = "ticks=14400"
              command = [sys.executable, str(root / "research/native-kernel/run.py"),
                         "--godot", sys.argv[1], "--script", builder.ORACLE_SCRIPTS[key],
                         *options, "--timeout", "2400"]
              print(f"Running {key}: {shlex.join(command)}", flush=True)
              with (logs / f"{key}.log").open("w", encoding="utf-8") as output:
                  result = subprocess.run(command, cwd=root, stdout=output, stderr=subprocess.STDOUT)
              print((logs / f"{key}.log").read_text(encoding="utf-8"), end="", flush=True)
              result.check_returncode()

          receipt = json.loads((builder.TOOL_ROOT / "build-receipt.json").read_text(encoding="utf-8"))
          sources = builder.mirrored_sources()
          for key, pattern in builder.VERIFICATIONS.items():
              proof = builder.find_verification(key, pattern, receipt["binary_sha256"], sources)
              expected = "fail" if key == "negative_control" else "pass"
              if proof["verdict"] != expected:
                  raise SystemExit(f"Unexpected {key} verdict: {proof}")
              print(f"Accepted {key}: {proof}", flush=True)
          PY
      - name: Install the verified library for production-path tests
        run: python3 research/native-kernel/build.py --install-app 2>&1 | tee tmp/nk3-ci/install-output.log
      - name: Require installed native stage, session, replay and helicopter branches
        run: |
          godot="$(app/get-godot.sh)"
          python3 tools/godot/run_checked.py --timeout 180 --out-dir tmp/nk3-ci/checks --label nk3-native-stage \
            --require-text 'NK3_NATIVE_STAGE_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_stage.gd
          python3 tools/godot/run_checked.py --timeout 240 --out-dir tmp/nk3-ci/checks --label nk3-native-session \
            --require-text 'NK3_NATIVE_SESSION_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_session.gd
          python3 tools/godot/run_checked.py --timeout 180 --out-dir tmp/nk3-ci/checks --label nk3-native-replay \
            --require-text 'NK3_NATIVE_REPLAY_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_replay.gd
          python3 tools/godot/run_checked.py --timeout 240 --out-dir tmp/nk3-ci/checks --label nk3-native-helicopter \
            --require-text 'NK3_NATIVE_HELICOPTER_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_native_helicopter_session.gd
          python3 tools/godot/run_checked.py --timeout 240 --out-dir tmp/nk3-ci/checks --label nk3-native-helicopter-radio \
            --require-text 'NK3_NATIVE_HELICOPTER_RADIO_NATIVE verdict=pass' -- \
            "$godot" --headless --path app --audio-driver Dummy --script res://tests/test_heli_restore_radio.gd
      - name: Verify native glow rejection provenance and stale-state guards
        run: |
          g++-13 -std=c++17 -fexceptions -fno-fast-math -ffp-contract=off -fPIC -m64 -march=x86-64 \
            -fvisibility=hidden -O3 -DNDEBUG -DLINUX_ENABLED -DUNIX_ENABLED -DTHREADS_ENABLED -DGDEXTENSION \
            research/native-kernel/test_glow_rejection_boundaries.cpp -o tmp/nk3-ci/glow-rejection-boundaries
          tmp/nk3-ci/glow-rejection-boundaries
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/nk3-ci/checks --label nk3-glow-rejection \
            --require-text 'NK3_GLOW_REJECTION_NATIVE verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_glow_rejection.gd"
      - name: Verify validated native admission boundaries
        run: |
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/nk3-ci/checks --label nk3-native-admission \
            --require-text 'NK3_NATIVE_ADMISSION verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_native_admission.gd"
          python3 tools/godot/run_checked.py --timeout 600 --out-dir tmp/nk3-ci/checks --label nk3-native-wheel-admission \
            --require-text 'NK3_NATIVE_WHEEL_ADMISSION verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_native_wheel_admission.gd"
      - name: Require paired native runtime-domain refusal proofs
        run: |
          python3 tools/godot/run_checked.py --timeout 1200 --out-dir tmp/nk3-ci/checks --label nk3-runtime-domain \
            --require-text 'NK3_RUNTIME_DOMAIN_NATIVE verdict=pass' -- \
            "$(app/get-godot.sh)" --headless --path app --audio-driver Dummy \
            --script "$PWD/research/native-kernel/test_fleet.gd" -- --require-runtime-domain
      - name: Check production reference/native parity (smoke only)
        run: |
          python3 research/performance/session_baseline.py --godot "$(app/get-godot.sh)" \
            --out tmp/nk3-ci/production-probe --aircraft jensen-das-ugly-stik-60 --case trim,runway \
            --warmup-ticks 24 --sample-ticks 240 --repeats 1 --compare-backends --timeout 300 \
            2>&1 | tee tmp/nk3-ci/production-probe.log
      - name: Preserve the locked godot-cpp checkout for export
        run: tar -czf tmp/native-kernel/godot-cpp-pinned.tar.gz -C tmp/native-kernel godot-cpp
      - name: Publish verified NK-3 build inputs for export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nk3-native-linux-build
          path: |
            tmp/native-kernel/lib/libopenrc_native_kernel.so
            tmp/native-kernel/lib/libopenrc_native_kernel_mutant.so
            tmp/native-kernel/*.json
            tmp/native-kernel/godot-cpp-pinned.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nk3-native-linux-diagnostics
          path: |
            tmp/nk3-ci/
            tmp/native-kernel/build*.log
            tmp/native-kernel/*.json
            tmp/native-kernel/checks/
            app/native/kernel/build-receipt.json
          if-no-files-found: ignore
          retention-days: 7

  visuals:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    name: Godot visual captures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1 python3-venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools/Godot_v*_linux.x86_64
            .tools/Godot_v*_linux.x86_64.sha512
            .tools/Godot_v*_linux.x86_64.zip
          key: godot-editor-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-godot.sh') }}
      - run: app/capture.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() # Preserve diagnostics when a capture gate fails.
        with:
          name: captures-app
          path: app/captures/*

  native-windows:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    name: RC native Windows build
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download pinned Godot Windows console editor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Godot_v4.8-beta1_win64.exe.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.8-beta1'
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.8-beta1/Godot_v4.8-beta1_win64.exe.zip' `
            -OutFile $archive
          $expected = 'bdc79f8ef47c3794c6984751bbac2c1934cf1c7c9ceebc2d0e87db0846766411b7bbbb6fecf90f3485f951a1289c3171b1c7bebca18dcdd8e08bd81de95b6cc0'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Godot Windows archive SHA-512 mismatch: expected $expected, got $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Filter 'Godot_v4.8-beta1_win64_console.exe' -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) {
            throw 'Pinned Godot Windows console executable was not present in the verified archive.'
          }
          $version = (& $godot --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '4.8.beta1.official.4d10419ca') {
            throw "Unexpected Godot Windows version: $version"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GODOT_WINDOWS_EXE=$godot"
      - name: Build, load, float64-check and compare the native Windows evaluator
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'The pinned MSVC C++ toolchain is not installed on this runner.'
          }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devcmd -PathType Leaf)) {
            throw "Visual Studio developer command file was not found: $devcmd"
          }
          $command = "call `"$devcmd`" -no_logo -arch=amd64 -host_arch=amd64 >nul && set"
          $developerEnvironment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not initialize the x64 Visual Studio developer environment.'
          }
          foreach ($entry in $developerEnvironment) {
            $separator = $entry.IndexOf('=')
            if ($separator -gt 0) {
              $name = $entry.Substring(0, $separator)
              $value = $entry.Substring($separator + 1)
              Set-Item -Path "Env:$name" -Value $value
            }
          }
          where.exe cl.exe
          if ($LASTEXITCODE -ne 0) {
            throw 'MSVC cl.exe was not available after initializing the developer environment.'
          }
          python research/rc-monster-truck/native/build.py --jobs 2 --godot "$env:GODOT_WINDOWS_EXE"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc-native-windows
          include-hidden-files: true # Explicit generated files inside .tools only.
          path: |
            .tools/native-ground-vehicle/openrc_ground_vehicle.dll
            .tools/native-ground-vehicle/build-receipt.windows.json
            .tools/native-ground-vehicle/parity-windows-latest.log

  # PT1: release builds. On main (which also warms the template cache: tag runs can only restore caches made on the
  # default branch), on v* tags, and by hand. Fails if an export errors, the exported Linux binary does not fly the
  # trimmed-flight check, or the macOS bundle is not universal and ad-hoc signed (app/export.sh).
  export:
    name: Release builds (Windows, Linux, macOS)
    if: needs.scope.outputs.export == 'true'
    # Package in parallel with app/visual checks; publication below still requires every check.
    needs: [scope, native-linux, native-windows, native-kernel-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history and tags: git describe names the packages and the build (UI-04a)
      - run: sudo apt-get update && sudo apt-get install -y zip binutils libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools/Godot_v*_linux.x86_64
            .tools/Godot_v*_linux.x86_64.sha512
            .tools/Godot_v*_linux.x86_64.zip
          key: godot-editor-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-godot.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/get-templates.sh') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-native-linux
          path: ${{ runner.temp }}/rc-native-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-native-windows
          path: ${{ runner.temp }}/rc-native-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nk3-native-linux-build
          path: tmp/native-kernel
      - name: Install matching Windows and Linux native artifacts before export
        run: |
          native_tool_root=".tools/native-ground-vehicle"
          mkdir -p "$native_tool_root"
          cp "$RUNNER_TEMP/rc-native-linux/libopenrc_ground_vehicle.so" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-linux/build-receipt.linux.json" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-windows/openrc_ground_vehicle.dll" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-windows/build-receipt.windows.json" "$native_tool_root/"
          cp "$RUNNER_TEMP/rc-native-linux/godot-cpp/LICENSE.md" "$native_tool_root/LICENSE.godot-cpp.md"
          python3 research/rc-monster-truck/native/build.py --install-only
      - name: Install oracle-qualified NK-3 Linux artifact before export
        run: |
          godot="$(app/get-godot.sh)"
          "$godot" --version
          tar -xzf tmp/native-kernel/godot-cpp-pinned.tar.gz -C tmp/native-kernel
          python3 research/native-kernel/build.py --install-app
      - id: packages
        run: app/export.sh # exact successful run path and build identity are step outputs
      - name: Preserve NK-3 package qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nk3-package-diagnostics
          path: |
            tmp/nk3-export-*/checks/
            tmp/nk3-export-*/user-data/
            tmp/nk3-export-*/player-replay/
            tmp/nk3-export-*/production-pair/
            tmp/nk3-export-*/default-route/checks/
            tmp/nk3-export-*/default-route/*.csv
            tmp/nk3-export-*/default-route/*.json
            tmp/nk3-export-*/trimmed.csv
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-builds
          path: |
            ${{ steps.packages.outputs.package_dir }}/openrc-simulator-${{ steps.packages.outputs.version }}-linux-x86_64.zip
            ${{ steps.packages.outputs.package_dir }}/openrc-simulator-${{ steps.packages.outputs.version }}-windows-x86_64.zip
            ${{ steps.packages.outputs.package_dir }}/openrc-simulator-${{ steps.packages.outputs.version }}-macos-universal.zip
            ${{ steps.packages.outputs.package_dir }}/release-manifest.json
            ${{ steps.packages.outputs.package_dir }}/linux-abi.json
            ${{ steps.packages.outputs.package_dir }}/SHA256SUMS
          if-no-files-found: error

  required:
    name: CI required
    if: always()
    needs: [scope, three, site, app, visuals, native-linux, native-windows, native-kernel-linux, export]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # Verify PR merge parents; policy fetches only an event-authorized missing base.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-selection
          path: tmp
      - name: Reject failed, cancelled, missing or unexpected skipped jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/policy.py verify --receipt tmp/ci-selection.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.scope.outputs.app == 'true'
        with:
          pattern: app-rosters-*
          path: tmp/ci-rosters
      - name: Reconcile every discovered unit and parse script
        if: needs.scope.outputs.app == 'true'
        run: python3 tools/ci/phase_roster.py verify-ci --app app --directory tmp/ci-rosters

  release:
    name: GitHub release (v* tags)
    if: startsWith(github.ref, 'refs/tags/v') && needs.required.result == 'success' && needs.export.result == 'success'
    needs: [required, export]
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-builds
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/publish.py --directory dist \
            --notes "docs/releases/$GITHUB_REF_NAME.md" \
            --expected-commit "$GITHUB_SHA" --expected-tag "$GITHUB_REF_NAME" \
            --expected-run-id "$GITHUB_RUN_ID" --expected-repository "$GITHUB_REPOSITORY"
