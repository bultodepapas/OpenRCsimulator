name: Windows test queue regressions

on:
  pull_request:
    paths:
      - 'tools/testqueue/**'
      - 'tools/debug/**'
      - 'tools/godot/**'
      - 'tools/godtest/**'
      - 'research/native-kernel/macos_engine_identity.py'
      - 'research/native-kernel/run.py'
      - 'research/performance/session_baseline.py'
      - 'research/performance/session_probe.gd'
      - 'research/performance/run_visibility_capture.py'
      - 'research/performance/test_session_baseline.py'
      - 'tools/ci/check-local.sh'
      - 'tools/readme/capture_aircraft.gd'
      - 'tools/release/macos_reference_receipt.py'
      - '.mcp.json'
      - '.github/workflows/testqueue-windows.yml'
  push:
    branches: [main]
    paths:
      - 'tools/testqueue/**'
      - 'tools/debug/**'
      - 'tools/godot/**'
      - 'tools/godtest/**'
      - 'research/native-kernel/macos_engine_identity.py'
      - 'research/native-kernel/run.py'
      - 'research/performance/session_baseline.py'
      - 'research/performance/session_probe.gd'
      - 'research/performance/run_visibility_capture.py'
      - 'research/performance/test_session_baseline.py'
      - 'tools/ci/check-local.sh'
      - 'tools/readme/capture_aircraft.gd'
      - 'tools/release/macos_reference_receipt.py'
      - '.mcp.json'
      - '.github/workflows/testqueue-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Windows ownership, scheduling and MCP fixtures
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            tools/testqueue
            tools/debug
            tools/godot
            tools/godtest
            tools/ci
            tools/readme
            tools/release
            research/performance
            research/native-kernel
            app/debug
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The actions manifest has no Windows x64 build for 3.12.12.
          python-version: '3.12.10'
      - name: Queue contracts and real Windows process containment
        run: |
          python -m unittest discover -s tools/testqueue -p 'test_*.py' 2>&1 | Tee-Object queue-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Debug and MCP protocol regressions
        run: |
          python -m unittest discover -s tools/debug -p 'test_*.py' 2>&1 | Tee-Object debug-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checked runner regressions
        run: |
          python -m unittest discover -s tools/godot -p 'test_run_checked.py' 2>&1 | Tee-Object checked-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resource runner and research admission regressions
        run: |
          python -m unittest discover -s tools/godot -p 'test_resource_runner.py' 2>&1 | Tee-Object resource-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s research/performance -p 'test_session_baseline.py' 2>&1 | Tee-Object performance-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/godtest -p 'test_*.py' 2>&1 | Tee-Object godtest-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-queue-fixtures
          path: '*-windows.log'
          if-no-files-found: warn
          retention-days: 14

# No simulator/GPU campaign runs here. test_native remains explicitly opt-in;
# these hosted process fixtures do not qualify a user's interactive desktop.
