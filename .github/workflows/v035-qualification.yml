name: OpenRC v0.3.5 release qualification
on:
  push:
    branches: [release-check/v0.3.5-qualification]
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and compare the exact inputs
        run: python3 .github/v035-qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d11g-reconstruction
          path: ${{ runner.temp }}/d11g-v035/evidence/
          if-no-files-found: error
